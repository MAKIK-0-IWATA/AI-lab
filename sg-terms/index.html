<title>SG用語 ドリル</title>

<style>
  :root{
    --paper:#FBFAF7; --card:#FFFFFF; --ink:#1C1F26; --ink-soft:#5C6274;
    --line:#E4E1D9; --line-soft:#EFEDE7;
    --ai:#2B4C7E; --ai-soft:#EAF0F8; --ai-ink:#2B4C7E;
    --ok:#2C7A58; --ok-soft:#E6F2EC;
    --ng:#B2433A; --ng-soft:#FAEBE9;
    --shadow:0 1px 2px rgba(28,31,38,.06), 0 8px 24px -12px rgba(28,31,38,.18);
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14161B; --card:#1B1E25; --ink:#E9E7E2; --ink-soft:#9BA1AF;
      --line:#2B2F39; --line-soft:#22262E;
      --ai:#82ABDE; --ai-soft:#1D2734; --ai-ink:#A8C6E8;
      --ok:#63B792; --ok-soft:#16281F;
      --ng:#E08078; --ng-soft:#2B1B19;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{
    --paper:#FBFAF7; --card:#FFFFFF; --ink:#1C1F26; --ink-soft:#5C6274;
    --line:#E4E1D9; --line-soft:#EFEDE7;
    --ai:#2B4C7E; --ai-soft:#EAF0F8; --ai-ink:#2B4C7E;
    --ok:#2C7A58; --ok-soft:#E6F2EC;
    --ng:#B2433A; --ng-soft:#FAEBE9;
    --shadow:0 1px 2px rgba(28,31,38,.06), 0 8px 24px -12px rgba(28,31,38,.18);
  }
  :root[data-theme="dark"]{
    --paper:#14161B; --card:#1B1E25; --ink:#E9E7E2; --ink-soft:#9BA1AF;
    --line:#2B2F39; --line-soft:#22262E;
    --ai:#82ABDE; --ai-soft:#1D2734; --ai-ink:#A8C6E8;
    --ok:#63B792; --ok-soft:#16281F;
    --ng:#E08078; --ng-soft:#2B1B19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--gothic); font-size:16px; line-height:1.7;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:600px; margin:0 auto; padding:0 16px 120px}

  /* ---- ヘッダ ---- */
  .bar{
    position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--line); margin:0 -16px 20px; padding:12px 16px 10px;
  }
  .bar__row{display:flex; align-items:baseline; gap:10px}
  .bar__title{
    font-family:var(--mincho); font-size:17px; font-weight:600; letter-spacing:.04em; margin:0;
  }
  .bar__meta{
    margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .track{height:3px; background:var(--line-soft); border-radius:2px; margin-top:9px; overflow:hidden}
  .track__fill{height:100%; background:var(--ai); width:0%; transition:width .25s ease}

  /* ---- 共通 ---- */
  h2{font-family:var(--mincho); font-size:15px; font-weight:600; letter-spacing:.08em; margin:0 0 12px; color:var(--ink-soft)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:var(--shadow)}
  .stack{display:flex; flex-direction:column; gap:16px}
  .row{display:flex; flex-wrap:wrap; gap:8px}

  button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
  button:focus-visible, input:focus-visible{outline:2px solid var(--ai); outline-offset:2px}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:13px 18px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); font-size:15px; font-weight:600; min-height:48px;
  }
  .btn--primary{background:var(--ai); border-color:var(--ai); color:#fff}
  :root[data-theme="dark"] .btn--primary, .btn--primary{color:#fff}
  @media (prefers-color-scheme: dark){ .btn--primary{color:#10141A} }
  :root[data-theme="dark"] .btn--primary{color:#10141A}
  :root[data-theme="light"] .btn--primary{color:#fff}
  .btn--wide{width:100%}
  .btn[disabled]{opacity:.4; cursor:not-allowed}

  .chip{
    padding:9px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); font-size:13.5px; min-height:40px; display:inline-flex; align-items:center;
  }
  .chip[aria-pressed="true"]{background:var(--ai-soft); border-color:var(--ai); color:var(--ai-ink); font-weight:600}

  /* ---- 設定画面 ---- */
  .lede{font-size:14px; color:var(--ink-soft); margin:0 0 22px}
  .count-row{display:flex; align-items:center; gap:12px}
  .count-row output{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:15px; min-width:3ch}
  input[type=range]{flex:1; accent-color:var(--ai); min-height:40px}

  .statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .statgrid div{background:var(--card); padding:14px 8px; text-align:center}
  .statgrid b{display:block; font-family:var(--mono); font-size:21px; font-variant-numeric:tabular-nums; font-weight:600}
  .statgrid span{font-size:11.5px; color:var(--ink-soft); letter-spacing:.04em}

  /* ---- 出題 ---- */
  .qkind{font-family:var(--mono); font-size:11px; letter-spacing:.12em; color:var(--ink-soft); margin:0 0 10px}
  .qbody{font-size:17px; line-height:1.85; margin:0}
  .qbody--term{font-family:var(--mincho); font-size:27px; line-height:1.5; letter-spacing:.02em}
  .qabbr{font-family:var(--mono); font-size:13px; color:var(--ai-ink); margin:6px 0 0; letter-spacing:.03em}

  .choices{display:flex; flex-direction:column; gap:9px; margin-top:18px}
  .choice{
    display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
    padding:14px 15px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); font-size:15px; line-height:1.6; min-height:52px;
  }
  .choice__no{
    font-family:var(--mono); font-size:12px; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:5px; width:22px; height:22px;
    display:grid; place-items:center; flex:none; margin-top:2px;
  }
  .choice[data-state="correct"]{border-color:var(--ok); background:var(--ok-soft)}
  .choice[data-state="correct"] .choice__no{border-color:var(--ok); color:var(--ok)}
  .choice[data-state="wrong"]{border-color:var(--ng); background:var(--ng-soft)}
  .choice[data-state="wrong"] .choice__no{border-color:var(--ng); color:var(--ng)}
  .choice[data-state="dim"]{opacity:.42}

  /* ---- 解説（3点セット） ---- */
  .verdict{display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; margin:0 0 14px}
  .verdict--ok{color:var(--ok)}
  .verdict--ng{color:var(--ng)}
  .set{display:grid; grid-template-columns:auto 1fr; gap:9px 14px; margin:0}
  .set dt{font-size:11.5px; color:var(--ink-soft); letter-spacing:.08em; padding-top:4px; white-space:nowrap}
  .set dd{margin:0; font-size:15px; line-height:1.7}
  .set dd.is-term{font-family:var(--mincho); font-size:20px; font-weight:600}
  .set dd.is-abbr{font-family:var(--mono); font-size:13.5px; color:var(--ai-ink)}
  .pairnote{
    margin:14px 0 0; padding:11px 13px; border-left:2px solid var(--ai);
    background:var(--ai-soft); border-radius:0 6px 6px 0; font-size:13.5px; line-height:1.75;
  }
  .pairnote b{font-weight:700}

  /* ---- フラッシュカード ---- */
  .flip{min-height:210px; display:flex; flex-direction:column; justify-content:center; gap:12px; text-align:center; cursor:pointer}
  .flip__hint{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink-soft)}

  /* ---- 結果 ---- */
  .score{font-family:var(--mono); font-size:46px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1}
  .score small{font-size:17px; color:var(--ink-soft)}
  .misslist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
  .misslist li{padding:11px 0; border-bottom:1px solid var(--line-soft)}
  .misslist li:last-child{border-bottom:none}
  .misslist b{font-family:var(--mincho); font-size:16.5px; display:block}
  .misslist span{font-size:13px; color:var(--ink-soft); display:block; margin-top:2px}
  .catbar{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; font-size:13.5px}
  .catbar .meter{grid-column:1/-1; height:5px; border-radius:3px; background:var(--line-soft); overflow:hidden; margin-bottom:9px}
  .catbar .meter i{display:block; height:100%; background:var(--ai)}
  .catbar .num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-soft)}

  /* ---- 下部固定バー ---- */
  .dock{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:linear-gradient(to top, var(--paper) 62%, transparent);
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .dock__in{max-width:600px; margin:0 auto; display:flex; gap:9px}

  /* ---- タブ ---- */
  .tabs{display:flex; gap:2px; background:var(--line-soft); padding:2px; border-radius:8px; margin-top:10px}
  .tabs button{flex:1; padding:8px; border-radius:6px; font-size:13.5px; font-weight:600; color:var(--ink-soft); min-height:38px}
  .tabs button[aria-selected="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* ---- 用語集 ---- */
  .gtools{margin-bottom:18px}
  .gsearch{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--ink); font:inherit; font-size:15px; min-height:48px;
  }
  .gcount{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin:8px 0 0; letter-spacing:.04em}
  .toc{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:30px}
  .toc a{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:12px 13px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); text-decoration:none; color:var(--ink); font-size:14px;
  }
  .toc a span{font-family:var(--mono); font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums}

  .gcat{margin:0 0 38px; scroll-margin-top:112px}
  .gcat__h{
    font-family:var(--mincho); font-size:23px; font-weight:600; letter-spacing:.05em;
    margin:0; padding-bottom:9px; border-bottom:2px solid var(--ai);
  }
  .gcat__n{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin:9px 0 20px; letter-spacing:.05em}

  .ggroup{margin:0 0 24px}
  .ggroup__h{
    font-size:13px; font-weight:700; letter-spacing:.07em; color:var(--ai-ink);
    margin:0 0 9px; display:flex; align-items:center; gap:9px;
  }
  .ggroup__h::before{content:""; width:15px; height:2px; background:var(--ai); flex:none}
  .gnote{margin:0 0 10px; padding:11px 13px; background:var(--ai-soft); border-radius:7px; font-size:13px; line-height:1.75}

  .gterms{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--card)}
  .gterm{padding:14px 15px; border-bottom:1px solid var(--line-soft)}
  .gterm:last-child{border-bottom:none}
  .gterm__t{
    font-family:var(--mincho); font-size:18px; font-weight:600; line-height:1.5;
    display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-bottom:3px;
  }
  .gterm__a{font-family:var(--mono); font-size:12.5px; font-weight:400; color:var(--ai-ink); letter-spacing:.02em}
  .gterm__f{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); font-weight:400}
  .gterm__d{font-size:14px; line-height:1.8}
  .gterm.is-weak{background:var(--ng-soft)}
  .tag-weak{
    font-family:var(--gothic); font-size:10.5px; font-weight:700; color:var(--ng);
    border:1px solid var(--ng); border-radius:4px; padding:1px 5px; letter-spacing:.05em;
  }
  .gempty{text-align:center; color:var(--ink-soft); padding:48px 0; font-size:14px}

  .totop{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:15;
    width:46px; height:46px; border-radius:50%; background:var(--card);
    border:1px solid var(--line); box-shadow:var(--shadow); display:grid; place-items:center;
    font-size:15px; color:var(--ink-soft);
  }

  @media print{
    .bar, .dock, .gtools, .toc, .totop{display:none !important}
    body{background:#fff; color:#000; font-size:11pt}
    .wrap{max-width:none; padding:0}
    .gterms{break-inside:avoid; box-shadow:none}
    .gcat{margin-bottom:20pt}
  }

  .hidden{display:none !important}
  .kbd{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:14px; text-align:center}
  @media (max-width:420px){ .kbd{display:none} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div class="bar">
  <div class="wrap" style="padding-bottom:0">
    <div class="bar__row">
      <h1 class="bar__title">SG用語 ドリル</h1>
      <span class="bar__meta" id="meta">科目A対策</span>
    </div>
    <div class="track" id="track"><div class="track__fill" id="fill"></div></div>
    <div class="tabs" id="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="setup">ドリル</button>
      <button role="tab" aria-selected="false" data-tab="glossary">用語集</button>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- ============ 設定 ============ -->
  <section id="setup" class="stack">
    <p class="lede">説明文から用語を当てる形式です。まちがえた選択肢は、<b>本番でひっかけに使われやすい似た用語</b>から優先的に選ばれます。</p>

    <div class="card">
      <h2>これまでの成績</h2>
      <div class="statgrid">
        <div><b id="s-seen">0</b><span>のべ出題</span></div>
        <div><b id="s-rate">—</b><span>正答率</span></div>
        <div><b id="s-weak">0</b><span>苦手な用語</span></div>
      </div>
    </div>

    <div class="card">
      <h2>分野をえらぶ</h2>
      <div class="row" id="cats"></div>
      <div class="row" style="margin-top:12px">
        <button class="chip" id="pick-all" aria-pressed="false">すべて</button>
        <button class="chip" id="pick-weak" aria-pressed="false">苦手だけ</button>
      </div>
    </div>

    <div class="card">
      <h2>問題数</h2>
      <div class="count-row">
        <input type="range" id="count" min="5" max="40" step="5" value="15" aria-label="問題数">
        <output id="count-out">15</output>
      </div>
    </div>

    <div class="card">
      <h2>形式</h2>
      <div class="row">
        <button class="chip" data-mode="quiz" aria-pressed="true">4択クイズ</button>
        <button class="chip" data-mode="card" aria-pressed="false">フラッシュカード</button>
      </div>
    </div>

    <button class="btn btn--primary btn--wide" id="start">はじめる</button>
    <p class="kbd">キーボード：1〜4で解答 / Enterで次へ</p>
  </section>

  <!-- ============ クイズ ============ -->
  <section id="quiz" class="hidden stack">
    <div class="card">
      <p class="qkind" id="q-kind">この説明にあてはまる用語は？</p>
      <p class="qbody" id="q-body"></p>
      <div class="choices" id="q-choices"></div>
    </div>
    <div class="card hidden" id="explain"></div>
  </section>

  <!-- ============ フラッシュカード ============ -->
  <section id="cardview" class="hidden stack">
    <div class="card flip" id="flip" role="button" tabindex="0" aria-label="カードをめくる">
      <p class="flip__hint" id="flip-hint">タップでめくる</p>
      <div id="flip-body"></div>
    </div>
  </section>

  <!-- ============ 結果 ============ -->
  <section id="result" class="hidden stack">
    <div class="card">
      <div class="score" id="r-score"></div>
      <p style="margin:6px 0 0; font-size:14px; color:var(--ink-soft)" id="r-note"></p>
    </div>
    <div class="card" id="r-cats-card">
      <h2>分野別</h2>
      <div id="r-cats"></div>
    </div>
    <div class="card hidden" id="r-miss-card">
      <h2>まちがえた用語</h2>
      <ul class="misslist" id="r-miss"></ul>
    </div>
  </section>

  <!-- ============ 用語集 ============ -->
  <section id="glossary" class="hidden">
    <div class="gtools">
      <input type="search" class="gsearch" id="gsearch" placeholder="用語・略語・説明から探す" aria-label="用語をさがす">
      <p class="gcount" id="gcount"></p>
    </div>
    <nav class="toc" id="toc" aria-label="分野へ移動"></nav>
    <div id="glist"></div>
  </section>

</div>

<button class="totop hidden" id="totop" aria-label="先頭にもどる">↑</button>

<div class="dock hidden" id="dock">
  <div class="dock__in" id="dock-in"></div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   用語データ
   t:用語  a:略語/英字  f:英語フル  d:何をするものか
   c:分野  g:混同しやすいグループ（誤答の選択肢はここから優先的に選ぶ）
   ========================================================= */
const CATS = {
  law:"法務・制度", risk:"リスク管理", tech:"技術的対策",
  atk:"攻撃・脅威", auth:"認証・暗号", ops:"運用・監査",
  sys:"テクノロジ系", mgmt:"マネジメント系", strat:"ストラテジ系"
};

const TERMS = [
/* ---------- 法務・制度 ---------- */
{t:"個人情報",d:"生存する個人を識別できる情報。氏名や生年月日など、他の情報と容易に照合して個人を特定できるものも含む",c:"law",g:"pii"},
{t:"要配慮個人情報",d:"人種・信条・病歴・犯罪の経歴など、不当な差別につながりうる情報。取得には原則として本人同意が必要",c:"law",g:"pii"},
{t:"仮名加工情報",d:"他の情報と照合しない限り個人を特定できないよう加工した情報。社内での分析利用を想定した区分",c:"law",g:"pii"},
{t:"匿名加工情報",d:"個人を特定できず、元の個人情報を復元できないよう加工した情報。本人同意なく第三者提供ができる",c:"law",g:"pii"},
{t:"不正アクセス禁止法",d:"他人のIDやパスワードを無断で使ってアクセスする行為、およびその助長行為を禁じる法律",c:"law",g:"lawname"},
{t:"不正競争防止法",d:"営業秘密の不正取得・使用や、他社の商品表示の混同を招く行為などを規制する法律",c:"law",g:"lawname"},
{t:"サイバーセキュリティ基本法",d:"国のサイバーセキュリティ戦略の基本理念と、国・自治体・事業者の責務を定めた法律",c:"law",g:"lawname"},
{t:"プロバイダ責任制限法",d:"ネット上の権利侵害について、プロバイダの賠償責任の範囲と発信者情報の開示請求手続を定めた法律",c:"law",g:"lawname"},
{t:"特定電子メール法",d:"広告宣伝メールの送信に、あらかじめ同意を得ること（オプトイン）などを義務づける法律",c:"law",g:"lawname"},
{t:"営業秘密",d:"秘密として管理され、有用で、公然と知られていない情報。この3要件をすべて満たす必要がある",c:"law"},
{t:"電子帳簿保存法",d:"国税関係の帳簿・書類を電子データで保存するための要件を定めた法律",c:"law",g:"lawname"},
{t:"偽装請負",d:"契約上は請負でありながら、発注者が実際には作業者へ直接指揮命令している状態。労働者派遣法に違反する",c:"law"},
{t:"ISMS",a:"ISMS",f:"Information Security Management System",d:"組織が情報セキュリティを継続的に管理・改善するための仕組み。PDCAで運用する",c:"law",g:"cert-org"},
{t:"JIS Q 27001",d:"ISMSの要求事項を定めた規格。認証を取得する際の基準になる",c:"law",g:"cert-org"},
{t:"JIS Q 27002",d:"情報セキュリティ管理策の実践のための規範。27001の要求を満たす具体的な手引き",c:"law",g:"cert-org"},

/* =========================================================
   状態
   ========================================================= */
const LS = "sg-drill-v1";
let store = load();
function load(){
  try{ return JSON.parse(localStorage.getItem(LS)) || {stats:{}}; }
  catch(e){ return {stats:{}}; }
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }
function key(term){ return term.t; }
function stat(term){
  const k = key(term);
  if(!store.stats[k]) store.stats[k] = {o:0,x:0};
  return store.stats[k];
}
function isWeak(term){
  const s = store.stats[key(term)];
  if(!s) return false;
  return s.x > 0 && s.x >= s.o;
}

let picked = new Set(Object.keys(CATS));
let mode = "quiz";
let queue = [], idx = 0, answered = false, results = [];

/* =========================================================
   画面
   ========================================================= */
const $ = id => document.getElementById(id);
const views = {setup:$("setup"), quiz:$("quiz"), cardview:$("cardview"), result:$("result"), glossary:$("glossary")};
function show(name){
  Object.keys(views).forEach(k => views[k].classList.toggle("hidden", k !== name));
  // ドリルの最中はタブを隠す（誤タップで解答が消えないように）
  const inDrill = (name === "quiz" || name === "cardview");
  $("tabs").classList.toggle("hidden", inDrill);
  $("track").classList.toggle("hidden", name === "glossary");
  $("totop").classList.toggle("hidden", name !== "glossary");
  window.scrollTo(0,0);
}
function dock(html){
  const d = $("dock");
  if(!html){ d.classList.add("hidden"); return; }
  $("dock-in").innerHTML = html;
  d.classList.remove("hidden");
}
function progress(p){ $("fill").style.width = Math.max(0,Math.min(100,p)) + "%"; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---- 設定画面の組み立て ---- */
function buildSetup(){
  const box = $("cats");
  box.innerHTML = "";
  Object.keys(CATS).forEach(id => {
    const n = TERMS.filter(t => t.c === id).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", picked.has(id));
    b.innerHTML = esc(CATS[id]) + ' <span style="opacity:.55;font-size:12px">' + n + "</span>";
    b.onclick = () => {
      picked.has(id) ? picked.delete(id) : picked.add(id);
      if(picked.size === 0) picked.add(id);
      buildSetup();
    };
    box.appendChild(b);
  });
  $("pick-all").setAttribute("aria-pressed", picked.size === Object.keys(CATS).length);
  const weakCount = TERMS.filter(isWeak).length;
  $("pick-weak").innerHTML = "苦手だけ " + '<span style="opacity:.55;font-size:12px">' + weakCount + "</span>";
  $("pick-weak").disabled = weakCount < 4;

  let seen = 0, ok = 0;
  Object.keys(store.stats).forEach(k => { seen += store.stats[k].o + store.stats[k].x; ok += store.stats[k].o; });
  $("s-seen").textContent = seen;
  $("s-rate").textContent = seen ? Math.round(ok/seen*100) + "%" : "—";
  $("s-weak").textContent = weakCount;
  progress(0);
  $("meta").textContent = "科目A対策";
}

$("pick-all").onclick = () => { picked = new Set(Object.keys(CATS)); buildSetup(); };
$("pick-weak").onclick = () => { startWeak(); };
$("count").oninput = e => $("count-out").textContent = e.target.value;
document.querySelectorAll("[data-mode]").forEach(b => {
  b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
  };
});
$("start").onclick = () => start(TERMS.filter(t => picked.has(t.c)));
function startWeak(){
  const pool = TERMS.filter(isWeak);
  if(pool.length < 4) return;
  start(pool);
}

/* ---- 出題の組み立て ---- */
function shuffle(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function start(pool){
  if(pool.length < 4){ return; }
  const n = Math.min(+$("count").value, pool.length);
  // 苦手な用語を優先的に前へ寄せる
  const weighted = shuffle(pool).sort((a,b) => (isWeak(b) ? 1 : 0) - (isWeak(a) ? 1 : 0));
  queue = weighted.slice(0, n);
  idx = 0; results = [];
  show(mode === "quiz" ? "quiz" : "cardview");
  mode === "quiz" ? renderQuiz() : renderCard();
}

/* 誤答の選択肢：同じ混同グループ → 同じ分野 → 全体 の順で埋める */
function distractors(correct){
  const out = [];
  const push = arr => {
    shuffle(arr).forEach(t => {
      if(out.length < 3 && t.t !== correct.t && !out.some(x => x.t === t.t)) out.push(t);
    });
  };
  if(correct.g) push(TERMS.filter(t => t.g === correct.g));
  push(TERMS.filter(t => t.c === correct.c));
  push(TERMS);
  return out;
}

/* ---- 4択クイズ ---- */
function renderQuiz(){
  answered = false;
  const q = queue[idx];
  $("meta").textContent = (idx + 1) + " / " + queue.length;
  progress(idx / queue.length * 100);
  $("explain").classList.add("hidden");
  $("q-kind").textContent = "この説明にあてはまる用語は？";
  $("q-body").className = "qbody";
  $("q-body").textContent = q.d;

  const opts = shuffle([q].concat(distractors(q)));
  const box = $("q-choices");
  box.innerHTML = "";
  opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = '<span class="choice__no">' + (i+1) + "</span><span>" + esc(o.t) +
      (o.a ? ' <span style="font-family:var(--mono);font-size:12.5px;opacity:.7">' + esc(o.a) + "</span>" : "") + "</span>";
    b.onclick = () => answer(o, q, box);
    box.appendChild(b);
  });
  dock('<button class="btn btn--wide" id="quit">やめる</button>');
  $("quit").onclick = () => finish(true);
}

function answer(chosen, q, box){
  if(answered) return;
  answered = true;
  const right = chosen.t === q.t;
  const s = stat(q);
  right ? s.o++ : s.x++;
  save();
  results.push({q, right, chosen});

  [...box.children].forEach(btn => {
    const label = btn.textContent.trim();
    const isCorrect = label.indexOf(q.t) === 0;
    const isChosen = label.indexOf(chosen.t) === 0;
    if(isCorrect) btn.dataset.state = "correct";
    else if(isChosen) btn.dataset.state = "wrong";
    else btn.dataset.state = "dim";
  });

  const e = $("explain");
  let html = '<p class="verdict ' + (right ? "verdict--ok" : "verdict--ng") + '">' +
    (right ? "◯　正解" : "×　不正解") + "</p>";
  html += '<dl class="set">';
  html += "<dt>用語</dt><dd class=\"is-term\">" + esc(q.t) + "</dd>";
  if(q.a) html += "<dt>略語</dt><dd class=\"is-abbr\">" + esc(q.a) + "</dd>";
  if(q.f) html += "<dt>英語</dt><dd class=\"is-abbr\">" + esc(q.f) + "</dd>";
  html += "<dt>はたらき</dt><dd>" + esc(q.d) + "</dd>";
  html += "<dt>分野</dt><dd>" + esc(CATS[q.c]) + "</dd>";
  html += "</dl>";
  if(q.g && PAIRNOTE[q.g]) html += '<p class="pairnote">' + PAIRNOTE[q.g] + "</p>";
  e.innerHTML = html;
  e.classList.remove("hidden");

  dock('<button class="btn btn--primary btn--wide" id="next">' +
    (idx + 1 >= queue.length ? "結果を見る" : "次の問題") + "</button>");
  $("next").onclick = next;
  $("next").focus();
}

function next(){
  idx++;
  if(idx >= queue.length){ finish(false); return; }
  renderQuiz();
}

/* ---- フラッシュカード ---- */
let flipped = false;
function renderCard(){
  flipped = false;
  const q = queue[idx];
  $("meta").textContent = (idx + 1) + " / " + queue.length;
  progress(idx / queue.length * 100);
  $("flip-hint").textContent = "タップでめくる";
  $("flip-body").innerHTML = '<p class="qbody" style="margin:0">' + esc(q.d) + "</p>";
  dock('<button class="btn" id="prev" style="flex:1">戻る</button>' +
       '<button class="btn btn--primary" id="fnext" style="flex:2">次へ</button>');
  $("prev").onclick = () => { if(idx > 0){ idx--; renderCard(); } };
  $("fnext").onclick = () => { idx++; idx >= queue.length ? finish(false) : renderCard(); };
}
function doFlip(){
  const q = queue[idx];
  flipped = !flipped;
  if(flipped){
    $("flip-hint").textContent = "こたえ";
    let h = '<p class="qbody qbody--term" style="margin:0">' + esc(q.t) + "</p>";
    if(q.a) h += '<p class="qabbr">' + esc(q.a) + (q.f ? "　" + esc(q.f) : "") + "</p>";
    if(q.g && PAIRNOTE[q.g]) h += '<p class="pairnote" style="text-align:left">' + PAIRNOTE[q.g] + "</p>";
    $("flip-body").innerHTML = h;
  } else {
    $("flip-hint").textContent = "タップでめくる";
    $("flip-body").innerHTML = '<p class="qbody" style="margin:0">' + esc(q.d) + "</p>";
  }
}
$("flip").onclick = doFlip;
$("flip").onkeydown = e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); doFlip(); } };

/* ---- 結果 ---- */
function finish(aborted){
  progress(100);
  if(mode === "card" || aborted && results.length === 0){
    buildSetup(); show("setup"); dock(null); return;
  }
  const ok = results.filter(r => r.right).length;
  const n = results.length;
  const pct = n ? Math.round(ok / n * 100) : 0;
  $("meta").textContent = "結果";
  $("r-score").innerHTML = pct + '<small>%</small>　<small>' + ok + " / " + n + "問</small>";
  $("r-note").textContent =
    pct >= 80 ? "この調子です。分野を広げてもう一周してみてください。" :
    pct >= 60 ? "合格ラインの目安（60%）は超えています。まちがえた用語を潰しましょう。" :
                "まだ伸びしろがあります。まちがえた用語だけを繰り返すのが近道です。";

  // 分野別
  const per = {};
  results.forEach(r => {
    const c = r.q.c;
    per[c] = per[c] || {o:0,n:0};
    per[c].n++; if(r.right) per[c].o++;
  });
  const cbox = $("r-cats");
  cbox.innerHTML = "";
  Object.keys(per).forEach(c => {
    const p = Math.round(per[c].o / per[c].n * 100);
    const d = document.createElement("div");
    d.className = "catbar";
    d.innerHTML = "<span>" + esc(CATS[c]) + '</span><span class="num">' + per[c].o + "/" + per[c].n +
      '</span><span class="meter"><i style="width:' + p + '%"></i></span>';
    cbox.appendChild(d);
  });

  // まちがえた用語
  const miss = results.filter(r => !r.right);
  $("r-miss-card").classList.toggle("hidden", miss.length === 0);
  const ml = $("r-miss");
  ml.innerHTML = "";
  miss.forEach(r => {
    const li = document.createElement("li");
    li.innerHTML = "<b>" + esc(r.q.t) + (r.q.a ? ' <span style="font-family:var(--mono);font-size:13px">' + esc(r.q.a) + "</span>" : "") +
      "</b><span>" + esc(r.q.d) + "</span>" +
      '<span style="color:var(--ng)">あなたの解答：' + esc(r.chosen.t) + "</span>";
    ml.appendChild(li);
  });

  show("result");
  const again = miss.length >= 4;
  dock((again ? '<button class="btn" id="retry" style="flex:1">まちがえた分</button>' : "") +
       '<button class="btn btn--primary" id="home" style="flex:2">最初にもどる</button>');
  if(again) $("retry").onclick = () => {
    queue = shuffle(miss.map(r => r.q)); idx = 0; results = [];
    show("quiz"); renderQuiz();
  };
  $("home").onclick = () => { buildSetup(); show("setup"); dock(null); };
}

/* =========================================================
   用語集（一覧）
   分野 → まとまり（混同しやすい組）の順に、常に同じ並びで表示する。
   並びを固定しているのは「あのあたりに書いてあった」で思い出せるようにするため。
   ========================================================= */
function buildGlossary(filter){
  const q = (filter || "").trim().toLowerCase();
  const match = t => !q ||
    t.t.toLowerCase().includes(q) ||
    (t.a && t.a.toLowerCase().includes(q)) ||
    (t.f && t.f.toLowerCase().includes(q)) ||
    t.d.toLowerCase().includes(q);

  const list = $("glist");
  const toc = $("toc");
  list.innerHTML = ""; toc.innerHTML = "";
  let total = 0;

  Object.keys(CATS).forEach(cid => {
    const all = TERMS.filter(t => t.c === cid && match(t));
    if(!all.length) return;
    total += all.length;

    // まとまりの並びは TERMS に現れた順で固定する
    const order = [];
    all.forEach(t => { const g = t.g || "_"; if(!order.includes(g)) order.push(g); });

    const sec = document.createElement("section");
    sec.className = "gcat";
    sec.id = "cat-" + cid;
    sec.innerHTML = '<h2 class="gcat__h">' + esc(CATS[cid]) + "</h2>" +
                    '<p class="gcat__n">' + all.length + " 語</p>";

    order.forEach(g => {
      const items = all.filter(t => (t.g || "_") === g);
      const wrap = document.createElement("div");
      wrap.className = "ggroup";
      const name = g === "_" ? "その他" : (GROUPNAME[g] || "そのほかのまとまり");
      let h = '<h3 class="ggroup__h">' + esc(name) + "</h3>";
      if(g !== "_" && PAIRNOTE[g]) h += '<p class="gnote">' + PAIRNOTE[g] + "</p>";
      h += '<div class="gterms">';
      items.forEach(t => {
        const weak = isWeak(t);
        h += '<div class="gterm' + (weak ? " is-weak" : "") + '">' +
             '<div class="gterm__t">' + esc(t.t) +
             (t.a ? '<span class="gterm__a">' + esc(t.a) + "</span>" : "") +
             (t.f ? '<span class="gterm__f">' + esc(t.f) + "</span>" : "") +
             (weak ? '<span class="tag-weak">要復習</span>' : "") +
             "</div>" +
             '<div class="gterm__d">' + esc(t.d) + "</div>" +
             "</div>";
      });
      h += "</div>";
      wrap.innerHTML = h;
      sec.appendChild(wrap);
    });

    list.appendChild(sec);

    const a = document.createElement("a");
    a.href = "#cat-" + cid;
    a.innerHTML = esc(CATS[cid]) + "<span>" + all.length + "</span>";
    toc.appendChild(a);
  });

  if(!total){
    list.innerHTML = '<p class="gempty">「' + esc(filter) + "」に一致する用語はありません</p>";
    toc.classList.add("hidden");
  } else {
    toc.classList.remove("hidden");
  }

  const weakN = TERMS.filter(isWeak).length;
  $("gcount").textContent = q
    ? total + " 語が一致"
    : "全 " + TERMS.length + " 語" + (weakN ? "　／　要復習 " + weakN + " 語" : "");
}

let searchTimer;
$("gsearch").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => buildGlossary(v), 150);
});

$("totop").onclick = () => window.scrollTo({top:0, behavior:"smooth"});

/* ---- タブ切り替え ---- */
document.querySelectorAll("[data-tab]").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b));
    dock(null);
    if(b.dataset.tab === "glossary"){
      $("meta").textContent = "用語集";
      buildGlossary($("gsearch").value);
      show("glossary");
    } else {
      buildSetup();
      show("setup");
    }
  };
});

/* ---- キーボード ---- */
document.addEventListener("keydown", e => {
  if(views.quiz.classList.contains("hidden")) return;
  if(!answered && e.key >= "1" && e.key <= "4"){
    const b = $("q-choices").children[+e.key - 1];
    if(b) b.click();
  } else if(answered && (e.key === "Enter" || e.key === " ")){
    e.preventDefault(); next();
  }
});

buildSetup();
})();
</script>
